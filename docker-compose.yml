name: grupo-mariposa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-auth-env: &auth-env
  AUTH_ENABLED: "true"
  AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/mariposa
  AUTH_JWKS_URL: http://keycloak:8080/realms/mariposa/protocol/openid-connect/certs

services:
  mongo:
    image: mongo:7.0
    entrypoint: ["bash", "/opt/mariposa/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_DATABASE: orders
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infra/mongo/mongo-entrypoint.sh:/opt/mariposa/mongo-entrypoint.sh:ro
      - ./infra/mongo/replica-set-healthcheck.sh:/opt/mariposa/replica-set-healthcheck.sh:ro
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "bash", "/opt/mariposa/replica-set-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *default-logging

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    logging: *default-logging

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["bash", "/opt/mariposa/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/mariposa/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: mariposa-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      ORDER_PROCESSOR_CLIENT_SECRET: ${ORDER_PROCESSOR_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./infra/keycloak/realm-mariposa.json:/opt/keycloak/data/import/realm-mariposa.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  config-server:
    build:
      context: ./config-server
    environment:
      CONFIG_BACKEND: native
      CONFIG_REPO_LOCATION: file:/config-repo
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    logging: *default-logging

  products-api:
    build:
      context: ./products-api
    environment:
      <<: *auth-env
      PORT: 8081
      AUTH_REQUIRED_ROLE: products-reader
      FAULT_RULES: ${PRODUCTS_FAULT_RULES:-PRD-012:503:2,PRD-013:timeout,PRD-014:400}
      FAULT_TIMEOUT_MS: 5000
      RATE_LIMIT_RPS: 200
      RATE_LIMIT_BURST: 400
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *default-logging

  clients-api:
    build:
      context: ./clients-api
    environment:
      <<: *auth-env
      PORT: 3000
      AUTH_REQUIRED_ROLE: clients-reader
      FAULT_RULES: ${CLIENTS_FAULT_RULES:-CLI-40001:503:2,CLI-40002:503}
      FAULT_TIMEOUT_MS: 5000
      RATE_LIMIT_RPS: 200
      RATE_LIMIT_BURST: 400
    ports:
      - "8082:3000"
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *default-logging

  order-processor:
    build:
      context: ./order-processor
    environment:
      <<: *auth-env
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/orders?replicaSet=rs0&authSource=orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PRODUCTS_API_URL: http://products-api:8081
      CLIENTS_API_URL: http://clients-api:3000
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/mariposa/protocol/openid-connect/token
      OAUTH_CLIENT_ID: order-processor
      OAUTH_CLIENT_SECRET: ${ORDER_PROCESSOR_CLIENT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: http://localhost:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATADOG_ENABLED: ${DATADOG_ENABLED:-false}
      DD_API_KEY: ${DD_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      products-api:
        condition: service_started
      clients-api:
        condition: service_started
    logging: *default-logging

  order-tracker:
    build:
      context: ./order-tracker
    environment:
      ORDERS_API_URL: http://order-processor:8080
      API_BASE_URL: /api
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: mariposa
      KEYCLOAK_CLIENT_ID: order-tracker
    ports:
      - "8090:8080"
    depends_on:
      order-processor:
        condition: service_started
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    logging: *default-logging

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686"
    logging: *default-logging

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    profiles: ["datadog"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: local
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_PROMETHEUS_SCRAPE_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/datadog/conf.d:/conf.d:ro
    logging: *default-logging

volumes:
  mongo-data:
  mongo-config:
  kafka-data:
