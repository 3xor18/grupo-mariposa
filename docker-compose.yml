name: grupo-mariposa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-config-client: &config-client
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_PROFILE: docker
  CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?run ./mariposa.sh init}
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?run ./mariposa.sh init}
  CONFIG_SERVER_FAIL_FAST: "true"

x-config-dependency: &config-dependency
  config-server:
    condition: service_healthy

x-master-data-dependency: &master-data-dependency
  mongo-users:
    condition: service_completed_successfully
  kafka-init:
    condition: service_completed_successfully

services:
  mongo:
    image: mongo:7.0.26
    entrypoint: ["bash", "/opt/mariposa/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run ./mariposa.sh init}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run ./mariposa.sh init}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infra/mongo/mongo-entrypoint.sh:/opt/mariposa/mongo-entrypoint.sh:ro
      - ./infra/mongo/replica-set-healthcheck.sh:/opt/mariposa/replica-set-healthcheck.sh:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "bash", "/opt/mariposa/replica-set-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    mem_limit: 1g
    logging: *default-logging

  mongo-users:
    image: mongo:7.0.26
    entrypoint: ["mongosh", "--quiet", "mongodb://mongo:27017/admin?replicaSet=rs0"]
    command: ["--file", "/opt/mariposa/ensure-users.js"]
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run ./mariposa.sh init}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run ./mariposa.sh init}
      MONGO_APP_DATABASE: orders
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?run ./mariposa.sh init}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?run ./mariposa.sh init}
      MONGO_CLIENTS_DATABASE: clients
      MONGO_CLIENTS_USERNAME: ${MONGO_CLIENTS_USERNAME:?run ./mariposa.sh init}
      MONGO_CLIENTS_PASSWORD: ${MONGO_CLIENTS_PASSWORD:?run ./mariposa.sh init}
      MONGO_PRODUCTS_DATABASE: products
      MONGO_PRODUCTS_USERNAME: ${MONGO_PRODUCTS_USERNAME:?run ./mariposa.sh init}
      MONGO_PRODUCTS_PASSWORD: ${MONGO_PRODUCTS_PASSWORD:?run ./mariposa.sh init}
    volumes:
      - ./infra/mongo/ensure-users.js:/opt/mariposa/ensure-users.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    logging: *default-logging

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,\
        CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    mem_limit: 1g
    logging: *default-logging

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["bash", "/opt/mariposa/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/mariposa/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m
    logging: *default-logging

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: mariposa-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7.4.7-alpine
    entrypoint: ["sh", "/opt/mariposa/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./mariposa.sh init}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run ./mariposa.sh init}
      REDIS_MAX_MEMORY: 128mb
      REDIS_EVICTION_POLICY: allkeys-lru
    volumes:
      - ./infra/redis/redis-entrypoint.sh:/opt/mariposa/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?run ./mariposa.sh init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run ./mariposa.sh init}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?run ./mariposa.sh init}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      ORDER_PROCESSOR_CLIENT_SECRET: ${ORDER_PROCESSOR_CLIENT_SECRET:?run ./mariposa.sh init}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?run ./mariposa.sh init}
    volumes:
      - ./infra/keycloak/realm-mariposa.json:/opt/keycloak/data/import/realm-mariposa.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  config-server:
    build:
      context: ./config-server
    environment:
      CONFIG_BACKEND: native
      CONFIG_REPO_LOCATION: file:/config-repo
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?run ./mariposa.sh init}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?run ./mariposa.sh init}
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"
    mem_limit: 384m
    logging: *default-logging

  products-api:
    build:
      context: ./products-api
    environment:
      <<: *config-client
      MONGODB_URI: "mongodb://${MONGO_PRODUCTS_USERNAME:?run ./mariposa.sh init}:\
        ${MONGO_PRODUCTS_PASSWORD:?run ./mariposa.sh init}@mongo:27017/products?\
        replicaSet=rs0&authSource=products"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      <<: [*config-dependency, *master-data-dependency]
      keycloak:
        condition: service_healthy
    stop_grace_period: 15s
    mem_limit: 128m
    logging: *default-logging

  clients-api:
    build:
      context: ./clients-api
    environment:
      <<: *config-client
      MONGODB_URI: "mongodb://${MONGO_CLIENTS_USERNAME:?run ./mariposa.sh init}:\
        ${MONGO_CLIENTS_PASSWORD:?run ./mariposa.sh init}@mongo:27017/clients?\
        replicaSet=rs0&authSource=clients"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      <<: [*config-dependency, *master-data-dependency]
      keycloak:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 256m
    logging: *default-logging

  order-processor:
    build:
      context: ./order-processor
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_FAIL_FAST: "true"
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME:?run ./mariposa.sh init}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD:?run ./mariposa.sh init}
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME:?run ./mariposa.sh init}:\
        ${MONGO_APP_PASSWORD:?run ./mariposa.sh init}@mongo:27017/orders?\
        replicaSet=rs0&authSource=orders"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./mariposa.sh init}
      OAUTH_CLIENT_SECRET: ${ORDER_PROCESSOR_CLIENT_SECRET:?run ./mariposa.sh init}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run ./mariposa.sh init}
      DATADOG_ENABLED: ${DATADOG_ENABLED:-false}
      DD_API_KEY: ${DD_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: [*config-dependency, *master-data-dependency]
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      products-api:
        condition: service_healthy
      clients-api:
        condition: service_healthy
    mem_limit: 1g
    logging: *default-logging

  order-tracker:
    build:
      context: ./order-tracker
    environment:
      <<: *config-client
      CONFIG_APP_NAME: order-tracker
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      <<: *config-dependency
      order-processor:
        condition: service_healthy
    mem_limit: 64m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint: ["sh", "/opt/mariposa/prometheus-entrypoint.sh"]
    environment:
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?run ./mariposa.sh init}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?run ./mariposa.sh init}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/prometheus/prometheus-entrypoint.sh:/opt/mariposa/prometheus-entrypoint.sh:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:?run ./mariposa.sh init}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run ./mariposa.sh init}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging: *default-logging

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *default-logging

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.72.0
    profiles: ["datadog"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: local
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_PROMETHEUS_SCRAPE_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/datadog/conf.d:/conf.d:ro
    mem_limit: 512m
    logging: *default-logging

volumes:
  mongo-data:
  mongo-config:
  kafka-data:
