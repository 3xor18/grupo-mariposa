openapi: 3.1.0
info:
  title: Orders query and tax rate administration API (order-processor)
  version: 1.1.0
  description: |
    Read side of processed orders and administration of effective-dated tax rates.
    Owner: order-processor team. Orders are consumed by the order-tracker PWA; tax rates are
    operated by users with the realm role orders-admin under four-eyes approval.
    Additive changes only within v1.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get the processing result of an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
          example: ORD-MX-000147
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /orders:
    get:
      operationId: listOrders
      summary: List processed orders, newest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [APPROVED, REJECTED, TECHNICAL_FAILURE]
        - name: market
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of order summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /tax-rates:
    get:
      operationId: listTaxRates
      summary: List tax rate periods and proposals, by market and category, newest first
      description: Requires the realm role orders-admin.
      parameters:
        - name: market
          in: query
          schema:
            $ref: '#/components/schemas/Market'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/TaxCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaxRateStatus'
      responses:
        '200':
          description: Tax rates matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: proposeTaxRate
      summary: Propose a tax rate that starts at validFrom, pending approval
      description: |
        Requires the realm role orders-admin. The proposer is taken from the token
        (preferred_username) and can never approve its own proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRateProposal'
            example:
              market: CO
              category: STANDARD
              rate: 0.21
              validFrom: '2027-01-01T05:00:00Z'
              changeReason: Reforma tributaria 2027
      responses:
        '201':
          description: Proposal stored with status PROPOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /tax-rates/{id}/approve:
    post:
      operationId: approveTaxRate
      summary: Approve a proposed tax rate
      description: |
        Requires the realm role orders-admin and a user other than the proposer
        (403 FOUR_EYES_REQUIRED otherwise). An open-ended approved period that starts earlier
        is closed at validFrom; overlaps or gaps answer 409 TAX_RATE_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/TaxRateId'
      responses:
        '200':
          description: Tax rate approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /tax-rates/{id}/reject:
    post:
      operationId: rejectTaxRate
      summary: Reject a proposed tax rate
      description: Requires the realm role orders-admin. Only PROPOSED rates can be rejected.
      parameters:
        - $ref: '#/components/parameters/TaxRateId'
      responses:
        '200':
          description: Tax rate rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak token. Orders need the realm role orders-reader (or orders-admin);
        tax rates need orders-admin.
  parameters:
    TaxRateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  responses:
    Problem:
      description: Error following RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '../common/problem.schema.json'
  schemas:
    Market:
      type: string
      pattern: '^[A-Z]{2}$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    RejectionReason:
      type: [string, 'null']
      description: Primary rejection code, null unless the order is REJECTED.
      enum:
        - null
        - CLIENT_NOT_FOUND
        - CLIENT_NOT_ACTIVE
        - CLIENT_MARKET_MISMATCH
        - PRODUCT_NOT_FOUND
        - PRODUCT_NOT_ACTIVE
    Money:
      type: number
      description: Monetary amount with two decimals, HALF_UP
    UnitPrice:
      type: number
      minimum: 0
      description: Unit price as received in the event, up to four decimals, never rounded
    Order:
      type: object
      required:
        - orderId
        - sourceEventId
        - eventVersion
        - status
        - market
        - currency
        - client
        - lines
        - totals
        - receivedAt
        - processedAt
      properties:
        orderId:
          type: string
        sourceEventId:
          type: string
        eventVersion:
          type: integer
        status:
          type: string
          enum: [APPROVED, REJECTED, TECHNICAL_FAILURE]
        market:
          $ref: '#/components/schemas/Market'
        currency:
          $ref: '#/components/schemas/Currency'
        channel:
          type: [string, 'null']
        client:
          $ref: '#/components/schemas/ClientSnapshot'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        totals:
          $ref: '#/components/schemas/Totals'
        reason:
          $ref: '#/components/schemas/RejectionReason'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        occurredAt:
          type: [string, 'null']
          format: date-time
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
        traceId:
          type: [string, 'null']
        taxRateEffectiveFrom:
          type: [string, 'null']
          format: date-time
          description: |
            Start of the most recent tax rate period applied to the order market at occurredAt
            (receivedAt when occurredAt is missing). Null for orders priced before the tax rate
            schedule existed.
    ClientSnapshot:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: string
        name:
          type: [string, 'null']
        status:
          type: [string, 'null']
        segment:
          type: [string, 'null']
        taxRegime:
          type: [string, 'null']
        market:
          type: [string, 'null']
    OrderLine:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
        name:
          type: [string, 'null']
        sku:
          type: [string, 'null']
        taxCategory:
          type: [string, 'null']
        quantity:
          type: integer
        unitPrice:
          $ref: '#/components/schemas/UnitPrice'
        grossSubtotal:
          $ref: '#/components/schemas/Money'
        discountRate:
          type: number
        discount:
          $ref: '#/components/schemas/Money'
        netSubtotal:
          $ref: '#/components/schemas/Money'
        taxRate:
          type: number
        taxAmount:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
    Totals:
      type: object
      required: [grossSubtotal, discount, netSubtotal, tax, grandTotal]
      properties:
        grossSubtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        netSubtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        grandTotal:
          $ref: '#/components/schemas/Money'
    Violation:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        productId:
          type: [string, 'null']
    Failure:
      type: object
      required: [category, cause, attempts]
      properties:
        category:
          type: string
        cause:
          type: string
        attempts:
          type: integer
    OrderSummary:
      type: object
      required: [orderId, status, market, currency, clientId, grandTotal, processedAt]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [APPROVED, REJECTED, TECHNICAL_FAILURE]
        market:
          $ref: '#/components/schemas/Market'
        currency:
          $ref: '#/components/schemas/Currency'
        clientId:
          type: string
        eventVersion:
          type: integer
        grandTotal:
          $ref: '#/components/schemas/Money'
        reason:
          $ref: '#/components/schemas/RejectionReason'
        processedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    TaxCategory:
      type: string
      enum: [STANDARD, REDUCED, EXEMPT]
    TaxRateStatus:
      type: string
      enum: [PROPOSED, APPROVED, REJECTED]
    TaxRateValue:
      type: number
      minimum: 0
      maximum: 1
      description: Fraction applied to the net subtotal of a line, up to four decimals
    TaxRateProposal:
      type: object
      required: [market, category, rate, validFrom, changeReason]
      properties:
        market:
          $ref: '#/components/schemas/Market'
        category:
          $ref: '#/components/schemas/TaxCategory'
        rate:
          $ref: '#/components/schemas/TaxRateValue'
        validFrom:
          type: string
          format: date-time
          description: Must be in the future unless the environment allows past dates
        validTo:
          type: [string, 'null']
          format: date-time
          description: Exclusive end; null keeps the rate open-ended
        changeReason:
          type: string
          minLength: 1
    TaxRate:
      type: object
      required:
        - id
        - market
        - category
        - rate
        - validFrom
        - status
        - proposedBy
        - proposedAt
        - changeReason
        - version
      properties:
        id:
          type: string
        market:
          $ref: '#/components/schemas/Market'
        category:
          $ref: '#/components/schemas/TaxCategory'
        rate:
          $ref: '#/components/schemas/TaxRateValue'
        validFrom:
          type: string
          format: date-time
        validTo:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/TaxRateStatus'
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
        reviewedBy:
          type: [string, 'null']
        reviewedAt:
          type: [string, 'null']
          format: date-time
        changeReason:
          type: string
        version:
          type: integer
          minimum: 0
