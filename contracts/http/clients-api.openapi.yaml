openapi: 3.1.0
info:
  title: Clients API
  version: 1.0.0
  description: |
    Distributor master data. Owner: clients team.
    Additive changes keep the same version; breaking changes require a new path prefix (/v2).
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
paths:
  /clients/{clientId}:
    get:
      operationId: getClient
      summary: Get a client by id
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^CLI-[A-Z0-9]{1,20}$'
          example: CLI-99821
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              example:
                clientId: CLI-99821
                name: Distribuidora Central
                status: ACTIVE
                segment: WHOLESALE
                taxRegime: GENERAL
                market: MX
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak token with realm role clients-reader
  responses:
    Problem:
      description: Error following RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '../common/problem.schema.json'
    Health:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [UP, DOWN]
  schemas:
    Client:
      type: object
      required: [clientId, name, status, segment, taxRegime, market]
      properties:
        clientId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        segment:
          type: string
          enum: [WHOLESALE, RETAIL]
        taxRegime:
          type: string
          enum: [GENERAL, SIMPLIFIED, EXEMPT]
        market:
          type: string
          enum: [MX, CO, PE]
