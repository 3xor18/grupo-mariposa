openapi: 3.1.0
info:
  title: Products API
  version: 1.0.0
  description: |
    Product catalog per market. Owner: products team.
    Additive changes keep the same version; breaking changes require a new path prefix (/v2).
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []
paths:
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Get a product available in a market
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: '^PRD-[A-Z0-9]{1,20}$'
          example: PRD-001
        - name: market
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
          example: MX
      responses:
        '200':
          description: Product found in the requested market
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productId: PRD-001
                name: Bebida 600 ml
                sku: BEB-600-PET
                status: ACTIVE
                taxCategory: STANDARD
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProduct
      summary: Update a product in a market (admin); publishes products.changed.v1
      description: |
        Partial update with optimistic concurrency. Send the current version in If-Match
        (the ETag of the last read);
        a stale version returns 412. Requires the realm role products-admin.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: market
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: Expected current version, e.g. "3". When omitted the update is unconditional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [ACTIVE, DISCONTINUED]
                taxCategory:
                  type: string
                  enum: [STANDARD, REDUCED, EXEMPT]
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '200':
          description: Updated; ETag carries the new version
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak token with realm role products-reader
  responses:
    Problem:
      description: Error following RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '../common/problem.schema.json'
    Health:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [UP, DOWN]
  schemas:
    Product:
      type: object
      required: [productId, name, sku, status, taxCategory]
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version (also sent as ETag)
        productId:
          type: string
        name:
          type: string
        sku:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISCONTINUED]
        taxCategory:
          type: string
          enum: [STANDARD, REDUCED, EXEMPT]
