openapi: 3.1.0
info:
  title: Products API
  version: 1.0.0
  description: |
    Product catalog per market. Owner: products team.
    Additive changes keep the same version; breaking changes require a new path prefix (/v2).
servers:
  - url: http://localhost:8081
security:
  - bearerAuth: []
paths:
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Get a product available in a market
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: '^PRD-[A-Z0-9]{1,20}$'
          example: PRD-001
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [MX, CO, PE]
          example: MX
      responses:
        '200':
          description: Product found in the requested market
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productId: PRD-001
                name: Bebida 600 ml
                sku: BEB-600-PET
                status: ACTIVE
                taxCategory: STANDARD
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak token with realm role products-reader
  responses:
    Problem:
      description: Error following RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '../common/problem.schema.json'
    Health:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [UP, DOWN]
  schemas:
    Product:
      type: object
      required: [productId, name, sku, status, taxCategory]
      properties:
        productId:
          type: string
        name:
          type: string
        sku:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISCONTINUED]
        taxCategory:
          type: string
          enum: [STANDARD, REDUCED, EXEMPT]
