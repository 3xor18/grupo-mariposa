publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  crypto: ^3.0.7
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  web: ^1.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
