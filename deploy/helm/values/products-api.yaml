image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/grupo-mariposa/products-api
containerPort: 8081
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi
env:
  PORT: "8081"
  AUTH_ENABLED: "true"
  AUTH_ISSUER: https://auth.grupomariposa.dev/realms/mariposa
  AUTH_JWKS_URL: https://auth.grupomariposa.dev/realms/mariposa/protocol/openid-connect/certs
  AUTH_REQUIRED_ROLE: products-reader
  FAULT_RULES: ""
  RATE_LIMIT_RPS: "500"
  RATE_LIMIT_BURST: "1000"
networkPolicy:
  enabled: true
  allowedFrom:
    - order-processor
