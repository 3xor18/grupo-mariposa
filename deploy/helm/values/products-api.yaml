image:
  repository: grupo-mariposa/products-api
containerPort: 8081
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi
env:
  PORT: "8081"
  AUTH_ENABLED: "true"
  AUTH_REQUIRED_ROLE: products-reader
  AUTH_AUDIENCE: products-api
  FAULT_INJECTION_ENABLED: "false"
  CONFIG_SERVER_URL: http://config-server.grupo-mariposa.svc.cluster.local
  CONFIG_APP_NAME: products-api
  CONFIG_SERVER_USERNAME: config-reader
  CONFIG_SERVER_FAIL_FAST: "true"
externalSecret:
  enabled: true
  remoteKey: grupo-mariposa/config-server
  keys:
    - CONFIG_SERVER_PASSWORD
networkPolicy:
  enabled: true
  allowedFrom:
    - order-processor
