global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: order-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-processor:8080"]
        labels:
          service: order-processor

  - job_name: products-api
    metrics_path: /metrics
    static_configs:
      - targets: ["products-api:8081"]
        labels:
          service: products-api

  - job_name: clients-api
    metrics_path: /metrics
    static_configs:
      - targets: ["clients-api:3000"]
        labels:
          service: clients-api

  - job_name: config-server
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /tmp/prometheus-secrets/config-server-username
      password_file: /tmp/prometheus-secrets/config-server-password
    static_configs:
      - targets: ["config-server:8888"]
        labels:
          service: config-server
