version: 2
updates:
  - package-ecosystem: maven
    directory: /order-processor
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /products-api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /clients-api
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /order-tracker
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/order-processor, /products-api, /clients-api, /order-tracker]
    schedule: { interval: weekly }
