name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  FLUTTER_VERSION: "3.44.0"
  HELM_VERSION: v3.16.2
  GOLANGCI_LINT_VERSION: v2.13.2
  OASDIFF_IMAGE: tufin/oasdiff:v1.32.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0
  AJV_CLI: ajv-cli@5
  AJV_FORMATS: ajv-formats@3
  GO_COVERAGE_MIN: "95"
  TRACKER_COVERAGE_MIN: "100"
  TRACKER_COVERAGE_EXCLUDE: '(^|/)lib/main\.dart$|/core/platform/web_browser\.dart$'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      products: ${{ steps.filter.outputs.products }}
      clients: ${{ steps.filter.outputs.clients }}
      processor: ${{ steps.filter.outputs.processor }}
      tracker: ${{ steps.filter.outputs.tracker }}
      config: ${{ steps.filter.outputs.config }}
      helm: ${{ steps.filter.outputs.helm }}
      karate: ${{ steps.filter.outputs.karate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            contracts: ['contracts/**', 'samples/events/**', 'scripts/ci/check-contracts.sh']
            products: ['products-api/**', 'contracts/**', 'scripts/ci/check-go-coverage.sh']
            clients: ['clients-api/**', 'contracts/**']
            processor: ['order-processor/**', 'contracts/**']
            tracker:
              - 'order-tracker/**'
              - 'contracts/http/order-processor.openapi.yaml'
              - 'scripts/ci/check-lcov-coverage.sh'
            config: ['config-server/**', 'config-repo/**']
            helm: ['deploy/helm/**', 'scripts/ci/validate-helm.sh']
            karate: ['e2e/karate/**']

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check out the base branch into a worktree
        if: github.event_name == 'pull_request'
        env:
          BASE_DIR: ${{ runner.temp }}/contracts-base
        run: git worktree add --detach "${BASE_DIR}" "origin/${BASE_REF}"
      - name: Breaking OpenAPI changes (oasdiff), schema compile and sample validation (ajv)
        env:
          BASE_DIR: ${{ runner.temp }}/contracts-base
        run: ./scripts/ci/check-contracts.sh "${BASE_DIR}"

  products-api:
    needs: changes
    if: needs.changes.outputs.products == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: products-api/go.mod
          cache-dependency-path: products-api/go.sum
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: products-api
      - run: go build ./...
      - run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Coverage gate
        run: ../scripts/ci/check-go-coverage.sh coverage.out "${GO_COVERAGE_MIN}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: products-api-coverage
          path: products-api/coverage.out

  clients-api:
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clients-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov

  order-processor:
    needs: changes
    if: needs.changes.outputs.processor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-processor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit, integration (Testcontainers), architecture and coverage gates
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: order-processor-reports
          path: |
            order-processor/target/site/jacoco
            order-processor/target/surefire-reports
            order-processor/target/failsafe-reports

  config-server:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tests and 100 % line coverage gate
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: config-server-reports
          path: |
            config-server/target/site/jacoco
            config-server/target/surefire-reports

  order-tracker:
    needs: changes
    if: needs.changes.outputs.tracker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-tracker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --line-length 100 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage gate (lib/, excluding the entrypoint and the browser adapter)
        run: >-
          ../scripts/ci/check-lcov-coverage.sh coverage/lcov.info
          "${TRACKER_COVERAGE_MIN}" "${TRACKER_COVERAGE_EXCLUDE}"

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint, render and validate every service and environment
        env:
          KUBECONFORM_CMD: docker run --rm -i ${{ env.KUBECONFORM_IMAGE }}
        run: ./scripts/ci/validate-helm.sh

  karate:
    needs: changes
    if: needs.changes.outputs.karate == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/karate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compile the acceptance suite
        run: ./mvnw -B -q test-compile

  images:
    needs:
      - products-api
      - clients-api
      - order-processor
      - order-tracker
      - config-server
      - contracts
      - helm
      - karate
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [products-api, clients-api, order-processor, order-tracker, config-server]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: grupo-mariposa/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grupo-mariposa/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    needs: [images, contracts, helm, karate]
    if: >-
      always() && needs.images.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (github.event_name == 'push' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright browser and system dependencies
        working-directory: order-tracker/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build .env from GitHub Secrets
        env:
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          ORDER_PROCESSOR_CLIENT_SECRET: ${{ secrets.ORDER_PROCESSOR_CLIENT_SECRET }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CONFIG_SERVER_PASSWORD: ${{ secrets.CONFIG_SERVER_PASSWORD }}
        run: ./scripts/ci/write-env-from-secrets.sh
      - name: Start platform
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 600
      - name: Karate API and event-flow suite, Playwright smoke suite
        run: ./mariposa.sh e2e
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-reports
          path: |
            compose-logs.txt
            e2e/karate/target/karate-reports
            order-tracker/e2e/playwright-report
