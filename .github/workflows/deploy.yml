name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      services:
        description: Services to deploy (comma separated)
        default: config-server,products-api,clients-api,order-processor,order-tracker
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  HELM_VERSION: v3.16.2
  IMAGE_PREFIX: grupo-mariposa

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      NAMESPACE: grupo-mariposa
      IMAGE_TAG: ${{ github.sha }}
      SERVICES: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate requested services against the allowlist
        id: services
        run: |
          resolved="$(./scripts/ci/resolve-services.sh)"
          echo "list=$(tr '\n' ' ' <<< "${resolved}")" >> "${GITHUB_OUTPUT}"
      - name: Build images
        env:
          RESOLVED: ${{ steps.services.outputs.list }}
        run: |
          read -ra list <<< "${RESOLVED}"
          for service in "${list[@]}"; do
            docker build -t "${IMAGE_PREFIX}/${service}:${IMAGE_TAG}" "${service}"
          done
      - name: Assume deploy role with OIDC (no static AWS keys)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Scan, push and roll out with the environment overlay
        run: ./scripts/ci/deploy-eks.sh
