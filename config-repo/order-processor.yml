management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      platform: grupo-mariposa

PRICING_TAX_MX_STANDARD: 0.16
PRICING_TAX_MX_REDUCED: 0.08
PRICING_TAX_MX_EXEMPT: 0.00
PRICING_TAX_CO_STANDARD: 0.19
PRICING_TAX_CO_REDUCED: 0.05
PRICING_TAX_CO_EXEMPT: 0.00
PRICING_TAX_PE_STANDARD: 0.18
PRICING_TAX_PE_REDUCED: 0.10
PRICING_TAX_PE_EXEMPT: 0.00
PRICING_TAX_CL_STANDARD: 0.19
PRICING_TAX_CL_REDUCED: 0.19
PRICING_TAX_CL_EXEMPT: 0.00
PRICING_TAX_EC_STANDARD: 0.15
PRICING_TAX_EC_REDUCED: 0.05
PRICING_TAX_EC_EXEMPT: 0.00
TAX_RATES_SEED_FROM: 2000-01-01T00:00:00Z
TAX_RATES_REFRESH_INTERVAL: 30s
TAX_RATES_ALLOW_PAST_VALID_FROM: false
PRICING_WHOLESALE_DISCOUNT_RATE: 0.03
PRICING_WHOLESALE_DISCOUNT_MIN_QUANTITY: 20
CACHE_PRODUCTS_TTL: 10m
CACHE_CLIENTS_TTL: 60s
HTTP_CONNECT_TIMEOUT: 500ms
HTTP_READ_TIMEOUT: 2s
HTTP_RETRY_MAX_ATTEMPTS: 3
RECORD_RETRY_MAX_ATTEMPTS: 4
OUTBOX_RELAY_INTERVAL: 250ms
AUTH_AUDIENCE: order-processor
